name: Lint (shell + workflows + changelog)

# =============================================================================
# The cheap half of this repo's CI, and the one that should run on every push.
#
# linux-release.yml costs ~25 minutes and four runners; this costs about a
# minute and catches the class of mistake that is most likely here: this
# repository is almost entirely shell, it is driven by a 77 KB zsh script that
# nothing type-checks, and a syntax error in any of it surfaces only when a
# release is already half done. `bash -n` / `zsh -n` on every script is a
# complete answer to that class, and it is free.
#
# TWO SHELLS, ROUTED BY SHEBANG, because this repo genuinely has both:
#   all/run.sh                      #!/usr/bin/env zsh
#   all/make-apple-dist-identity.sh #!/bin/zsh
#   everything else                 #!/usr/bin/env bash
# Checking run.sh with bash is not a stricter test, it is a WRONG one — it
# fails on `*.msi(N)`, zsh's nullglob qualifier, which is load-bearing in the
# release uploads. So each file is checked with the shell it declares.
#
# shellcheck runs at --severity=error ONLY as a gate. The repo is clean at that
# level today and staying clean is a real property; running it at `style` and
# gating on it would be a large, unrelated cleanup, so the lower severities are
# reported to the job summary as advice and fail nothing.
# =============================================================================

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # No submodules: every script this checks lives in this repository.
      - name: Check out the build repo
        uses: actions/checkout@v4

      # zsh is not on the runner image. shellcheck is (and is not needed for
      # the zsh half — shellcheck cannot parse zsh at all, which is the other
      # half of why the routing below exists).
      - name: Install zsh
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            install -y --no-install-recommends zsh
          zsh --version
          shellcheck --version

      - name: Parse every script with the shell it declares
        run: |
          set -uo pipefail
          bash_files=()
          zsh_files=()
          while IFS= read -r f; do
            # The shebang is the routing key. all/windows/lib.sh has no
            # shebang (it is sourced) but declares `# shellcheck shell=bash`,
            # and falls into the bash bucket by default, which is correct.
            case "$(head -n 1 "$f")" in
              *zsh*) zsh_files+=("$f") ;;
              *)     bash_files+=("$f") ;;
            esac
          done < <(git ls-files '*.sh')
          echo "bash: ${#bash_files[@]} file(s), zsh: ${#zsh_files[@]} file(s)"
          fail=0
          for f in "${bash_files[@]}"; do
            if bash -n "$f"; then
              echo "ok  bash -n $f"
            else
              echo "::error file=$f::bash -n failed"
              fail=1
            fi
          done
          for f in "${zsh_files[@]}"; do
            if zsh -n "$f"; then
              echo "ok  zsh -n $f"
            else
              echo "::error file=$f::zsh -n failed"
              fail=1
            fi
          done
          # Persist the split for the steps below rather than recomputing it.
          printf '%s\n' "${bash_files[@]}" > "$RUNNER_TEMP/bash_files.txt"
          exit $fail

      # THE GATE. -x follows `source`d files, which matters: all/build-linux.sh
      # sources all/stage-local-repos.sh, and without -x shellcheck reports the
      # sourced function as an unknown command.
      - name: shellcheck (errors only — this one fails the build)
        run: |
          set -uo pipefail
          mapfile -t bash_files < "$RUNNER_TEMP/bash_files.txt"
          shellcheck --severity=error --shell=bash -x "${bash_files[@]}"

      - name: shellcheck (style + info — advisory, never fails)
        if: always()
        run: |
          set -uo pipefail
          mapfile -t bash_files < "$RUNNER_TEMP/bash_files.txt"
          out="$RUNNER_TEMP/shellcheck-advice.txt"
          shellcheck --severity=style --shell=bash -x -f gcc "${bash_files[@]}" > "$out" 2>&1 || true
          n=$(wc -l < "$out")
          {
            echo "### shellcheck advice (not a gate): $n finding(s)"
            echo
            echo '```'
            head -n 200 "$out"
            if [ "$n" -gt 200 ]; then echo "... $((n - 200)) more"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  workflows:
    name: Workflow files
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the build repo
        uses: actions/checkout@v4

      # Pinned AND checksum-verified, the same rule Dockerfile.daemon applies
      # to nfpm: a linter that silently became a different linter is how a
      # green run stops meaning anything. The digest is the one published in
      # actionlint_1.7.7_checksums.txt.
      - name: Install actionlint (pinned, checksum-verified)
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/actionlint.tgz" "$url"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          sudo install -m 0755 "$RUNNER_TEMP/actionlint" /usr/local/bin/actionlint
          actionlint --version

      # actionlint parses the YAML, type-checks every ${{ }} expression against
      # the contexts each trigger actually provides, validates `runs-on` labels
      # and `needs` graphs, and runs shellcheck over every `run:` block. The
      # last part is why this job exists at all: a `run:` block is shell that
      # nothing else in this repository would ever look at.
      - name: actionlint
        run: actionlint -no-color -oneline

      # A second, independent parse. actionlint is strict about GitHub's schema;
      # this catches the plain YAML mistakes (bad indent, duplicate key) with a
      # different parser, so one tool's blind spot is not the whole check.
      - name: Parse the workflow YAML with a second parser
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, sys, yaml
          fail = 0
          for p in sorted(pathlib.Path('.github/workflows').glob('*.y*ml')):
              try:
                  d = yaml.safe_load(p.read_text())
              except Exception as e:                      # noqa: BLE001
                  print(f"::error file={p}::{e}")
                  fail = 1
                  continue
              # `on:` is YAML 1.1's boolean True, which is the single most
              # common surprise when a script reads a workflow file.
              trigger = d.get('on', d.get(True))
              if not trigger:
                  print(f"::error file={p}::no triggers")
                  fail = 1
              if not d.get('jobs'):
                  print(f"::error file={p}::no jobs")
                  fail = 1
              print(f"ok  {p}: jobs={list((d.get('jobs') or {}).keys())}")
          sys.exit(fail)
          PY

  changelog:
    name: Changelog generator
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # No submodules and no tags on purpose. The generator resolves a release
      # ref from the local clone when it can and from the GitHub API when it
      # cannot, and a default shallow checkout has neither the tags nor the
      # submodules -- so running it here exercises the API fallback path, which is
      # the one a fresh CI runner will always take.
      - name: Check out the build repo
        uses: actions/checkout@v4

      - name: Syntax
        run: python3 -m py_compile all/changelog.py

      # The generator's own checks: the noise filters against the exact strings
      # all/run.sh commits, the 500-character store budget, the non-shipping-path
      # rule against real file lists, the markdown escaping, and the release-body
      # size ladder. No network, no token, no rate limit -- so it is a gate.
      - name: changelog.py self-test
        run: python3 all/changelog.py --self-test

      # THE HARD ASSERT, and this is the right place for it.
      #
      # fdroidserver truncates a changelog at 500 characters SILENTLY
      # (update.py's _set_localized_text_entry does `text[:limit]` -- no warning,
      # no error, no log), and Google Play rejects an over-length note outright.
      # all/run.sh cannot afford to fail on this: a release that is already half
      # published must not be lost over release notes, so there it is a
      # builder_message warning and a fallback. Here, failing loudly is free.
      #
      # Characters, not bytes. Every file in the repo is ASCII today so `wc -c`
      # would agree, but the generator now pulls subjects and bodies out of 17
      # submodules and those carry em dashes and non-ASCII author names -- at
      # which point `wc -c` over-counts and would fail a file that is actually
      # fine, while a byte budget would under-count the room a store really has.
      #
      # The trailing newline is excluded deliberately. F-Droid's slice is applied
      # to a read that includes it, so a 500-character body plus "\n" survives
      # intact; reserving a character for the newline would throw away a
      # character of real changelog for nothing.
      - name: Every store changelog fits the 500-character store limit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, sys
          LIMIT = 500
          fail = 0
          files = sorted(pathlib.Path('metadata/en-US/changelogs').glob('*.txt'))
          worst = 0
          for p in files:
              raw = p.read_bytes()
              if raw.startswith(b'\xef\xbb\xbf'):
                  print(f"::error file={p}::UTF-8 BOM -- F-Droid counts it against the 500")
                  fail = 1
              text = raw.decode('utf-8')
              if text[:1].isspace():
                  print(f"::error file={p}::leading whitespace -- whatsNew is sliced raw, "
                        "it is not stripped the way name/summary/video are")
                  fail = 1
              n = len(text.rstrip('\n'))
              worst = max(worst, n)
              if n > LIMIT:
                  print(f"::error file={p}::{n} characters, limit {LIMIT} -- "
                        "F-Droid would cut this mid-sentence without saying so")
                  fail = 1
          print(f"checked {len(files)} changelog file(s); longest is {worst}/{LIMIT} characters")
          sys.exit(fail)
          PY

      # THE SECOND HARD ASSERT, and it is deliberately a separate step with its
      # own numbers rather than a widening of the one above.
      #
      # The 500 gate exists to protect the android note, which F-Droid publishes
      # unattended and truncates in silence. Raising its LIMIT so that a 4000-char
      # Apple note could share it would un-protect exactly the file it was written
      # for. So: different tree, different step, different limits, and the two
      # cannot drift into each other.
      #
      # The Linux note is not checked against a length at all, because AppStream
      # has none. It is checked against the rules `appstreamcli validate
      # --no-net --pedantic` enforces -- which is what urnetwork/linux's own CI
      # runs, with warnings treated as failures. Those rules live in
      # all/changelog.py (appstream_problems) rather than being restated here, so
      # there is one copy of them and the generator and the gate cannot disagree.
      # appstreamcli itself is not installed on the runner and is not needed:
      # every rule it would fail us on is a structural property of the fragment.
      - name: Every per-store note fits its own storefront's limit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, sys
          sys.path.insert(0, 'all')
          import changelog

          fail = 0
          seen = 0
          root = pathlib.Path('store-notes')
          for name, a in sorted(changelog.AUDIENCES.items()):
              if not a['out']:
                  continue
              p = root / a['out']
              if not p.exists():
                  # These are written by a release run, not committed by hand, so
                  # "not there yet" is normal and is not a failure.
                  print(f"skip {p} (no release has written it yet)")
                  continue
              seen += 1
              raw = p.read_bytes()
              if raw.startswith(b'\xef\xbb\xbf'):
                  print(f"::error file={p}::UTF-8 BOM")
                  fail = 1
              text = raw.decode('utf-8')
              if a['format'] == 'appstream':
                  problems = changelog.appstream_problems(text)
                  for msg in problems:
                      print(f"::error file={p}::appstreamcli would fail this: {msg}")
                      fail = 1
                  print(f"ok   {p}: {len(text)} chars of AppStream XML, "
                        f"{len(problems)} problem(s)")
                  continue
              if text[:1].isspace():
                  print(f"::error file={p}::leading whitespace")
                  fail = 1
              n = len(text.rstrip('\n'))
              if n > a['limit']:
                  print(f"::error file={p}::{n} characters, {name} accepts "
                        f"{a['limit']}")
                  fail = 1
              print(f"ok   {p}: {n}/{a['limit']} characters ({name})")
          print(f"checked {seen} per-store note(s)")
          sys.exit(fail)
          PY

      # ADVISORY, never a gate. This one talks to api.github.com, and a lint
      # workflow whose whole argument is that it is cheap and always green must
      # not go red because GitHub had a bad minute. The gate above is offline.
      #
      # It walks a fixed historical pair, so the expected output never drifts,
      # and it runs the generator twice into different files and diffs them --
      # which is the determinism claim, checked rather than asserted.
      - name: Generate a real changelog and prove it is deterministic (advisory)
        id: smoke
        continue-on-error: true
        env:
          GITHUB_API_KEY: ${{ secrets.GITHUB_TOKEN }}
          FROM_TAG: v2026.8.21-1025223880
          TO_TAG: v2026.8.21-1025763520
        run: |
          set -euo pipefail
          for i in 1 2; do
            python3 all/changelog.py \
              --from "$FROM_TAG" --to "$TO_TAG" \
              --store-out "$RUNNER_TEMP/store$i.txt" \
              --store-notes-dir "$RUNNER_TEMP/notes$i" \
              --full-out "$RUNNER_TEMP/full$i.md"
          done
          diff -u "$RUNNER_TEMP/store1.txt" "$RUNNER_TEMP/store2.txt"
          diff -u "$RUNNER_TEMP/full1.md" "$RUNNER_TEMP/full2.md"
          # Every storefront, not just the one --store-out wrote: four notes
          # rendered from one walk is four chances for a shared cache or a
          # dict iteration order to make a run non-reproducible.
          diff -ru "$RUNNER_TEMP/notes1" "$RUNNER_TEMP/notes2"
          n=$(python3 -c 'import sys;print(len(open(sys.argv[1],encoding="utf-8").read().rstrip("\n")))' "$RUNNER_TEMP/store1.txt")
          echo "store note: $n/500 characters, identical across two runs"
          test "$n" -le 500
          test -s "$RUNNER_TEMP/full1.md"
          {
            echo "### Changelog smoke test: \`$FROM_TAG\` -> \`$TO_TAG\`"
            echo
            echo "Store note ($n/500 characters):"
            echo
            echo '```'
            cat "$RUNNER_TEMP/store1.txt"
            echo '```'
            echo
            for f in "$RUNNER_TEMP"/notes1/*/*.txt "$RUNNER_TEMP"/notes1/*/*/*.txt \
                     "$RUNNER_TEMP"/notes1/*/*.xml; do
              [ -e "$f" ] || continue
              echo "Per-store note \`${f#"$RUNNER_TEMP"/notes1/}\` "
              echo "($(python3 -c 'import sys;print(len(open(sys.argv[1],encoding="utf-8").read().rstrip("\n")))' "$f") characters):"
              echo
              echo '```'
              cat "$f"
              echo '```'
              echo
            done
            echo "<details><summary>Full changelog</summary>"
            echo
            cat "$RUNNER_TEMP/full1.md"
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Say so if the smoke test could not run
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "::warning::the networked changelog smoke test did not pass; \
          the offline gates above did. Check the step log before assuming the \
          generator is broken."
